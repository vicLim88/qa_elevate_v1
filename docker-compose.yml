version: '3.8'

services:
  ai-test-generator:
    build: .
    container_name: ai-test-generator
    ports:
      - "3000:3000"
    env_file:
      - ./.env
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ollama-data:/root/.ollama

volumes:
  ollama-data: